name: "nightly"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  spec:
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - '3.2'
          - '4.0'
        include:
          - ruby_version: '3.2'
            puppet_version: '~> 8.0'
          - ruby_version: '4.0'
            puppet_version: '~> 9.0'
    name: "spec (ruby ${{ matrix.ruby_version }} | puppet ${{ matrix.puppet_version }})"
    uses: "puppetlabs/cat-github-actions/.github/workflows/gem_ci.yml@main"
    secrets: "inherit"
    with:
      rake_task: "spec:simplecov"
      ruby_version: ${{ matrix.ruby_version }}
      puppet_gem_version: ${{ matrix.puppet_version }}

  acceptance:
    needs: "spec"
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - "3.2"
          - "4.0"
        include:
          - ruby_version: '3.2'
            puppet_version: '~> 8.0'
            puppet_collection: 'puppet8'
          - ruby_version: '4.0'
            puppet_version: '~> 9.0'
            puppet_collection: 'puppet9'
        runs_on:
          - "ubuntu-latest"
    name: "acceptance (${{ matrix.runs_on }} ruby ${{ matrix.ruby_version }} | puppet ${{ matrix.puppet_version }})"
    uses: "./.github/workflows/custom_acceptance.yml"
    secrets: "inherit"
    with:
      ruby_version: ${{ matrix.ruby_version }}
      puppet_version: ${{ matrix.puppet_version }}
      puppet_collection: ${{ matrix.puppet_collection }}
      runs_on: ${{ matrix.runs_on }}

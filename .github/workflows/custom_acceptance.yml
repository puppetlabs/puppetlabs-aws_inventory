# Re-uses ruby-pwsh's custom_acceptance.yml shape (workflow_call inputs +
# checkout/setup-ruby/bundle-exec-rake steps) so the acceptance job can be
# matrixed by ruby_version/puppet_version the same way "spec" is.
#
# Deviates only where a Puppet module genuinely needs it: this repo has no
# provision.yaml, so acceptance needs an explicit litmus docker
# provision/install/run/tear-down sequence rather than ruby-pwsh's single
# generic rake_task (which assumes no ephemeral test node to clean up).
name: "Gem Acceptance"

on:
  workflow_call:
    inputs:
      ruby_version:
        description: "The target Ruby version."
        required: false
        default: "3.1"
        type: "string"
      puppet_version:
        description: "The target Puppet gem version constraint (for bundle install)."
        required: false
        default: "~> 8.0"
        type: "string"
      puppet_collection:
        description: "The litmus puppet-agent collection to install (e.g. puppet8, puppet9)."
        required: false
        default: "puppet8"
        type: "string"
      rake_task:
        description: "The name of the rake task that executes acceptance tests"
        required: false
        default: "litmus:acceptance:parallel"
        type: "string"
      runs_on:
        description: "The operating system used for the runner."
        required: false
        default: "ubuntu-latest"
        type: "string"
      collection_image:
        description: "The litmus docker collection image to provision."
        required: false
        default: "litmusimage/ubuntu:24.04"
        type: "string"

env:
  PUPPET_FORGE_TOKEN: ${{ secrets.PUPPET_FORGE_TOKEN || secrets.PUPPET_FORGE_TOKEN_PUBLIC }}
  BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: "forge-key:${{ secrets.PUPPET_FORGE_TOKEN || secrets.PUPPET_FORGE_TOKEN_PUBLIC }}"

jobs:
  acceptance:
    name: "acceptance"
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 60

    steps:

      - name: "checkout"
        uses: "actions/checkout@v4"

      - name: "export environment"
        run: |
          echo "PUPPET_GEM_VERSION=${{ inputs.puppet_version }}" >> $GITHUB_ENV

      - name: "setup ruby"
        uses: "ruby/setup-ruby@v1"
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: "bundle environment"
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::

      - name: "provision environment"
        run: |
          bundle exec rake "litmus:provision[docker,${{ inputs.collection_image }}]"

      - name: "install puppet agent"
        run: |
          bundle exec rake "litmus:install_agent[${{ inputs.puppet_collection }}]"

      - name: "install module"
        run: |
          bundle exec rake "litmus:install_module"

      - name: "execute acceptance tests"
        run: |
          bundle exec rake ${{ inputs.rake_task }}

      - name: "remove test environment"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ -f spec/fixtures/litmus_inventory.yaml ]]; then
            bundle exec rake "litmus:tear_down"
          fi
